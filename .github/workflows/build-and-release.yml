name: Build & Release cerebro-mcp

on:
  push:
    branches:
      - main

concurrency:
  group: cerebro-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Organization Name
        id: org_name
        run: |
          org_name=$(echo "${{ github.repository_owner }}")
          echo "Organization Name: $org_name"
          echo "org_name=$org_name" >> $GITHUB_OUTPUT

      - name: Extract commit
        id: commit
        uses: prompt/actions-commit-hash@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, both tags. This used to be two full `docker buildx build`
      # invocations with no cache flags, so `npm ci` + the 11 vite builds in the
      # ui-builder stage ran four times per push (2 tags x 2 arches) to produce
      # byte-identical output.
      #
      # mode=max on cache-to is MANDATORY, not a tuning knob: ui-builder is not
      # part of the final image, so the default mode=min exports only the runtime
      # stage's layers and the UI would rebuild from scratch every run — exactly
      # the cost this cache exists to remove. Registry cache rather than
      # type=gha: no 10 GB Actions-cache budget or eviction, survives across
      # branches, and the ghcr credentials are already in scope above.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.org_name.outputs.org_name }}/gc-cerebro-mcp:latest
            ghcr.io/${{ steps.org_name.outputs.org_name }}/gc-cerebro-mcp:${{ steps.commit.outputs.short }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.org_name.outputs.org_name }}/gc-cerebro-mcp:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.org_name.outputs.org_name }}/gc-cerebro-mcp:buildcache,mode=max
