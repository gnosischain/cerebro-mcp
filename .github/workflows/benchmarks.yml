name: benchmarks

# Regression gate: pytest + the deterministic, in-process benchmark suites
# (search / workflows / semantic). No ClickHouse, no secrets — these suites run
# against the committed fixtures and self-gate on correctness (a lost hit@5, an
# SQL-golden hash mismatch, a new orphan metric, a broken workflow gate all make
# `benchmarks.run` exit non-zero). Latency is deliberately NOT run here: p50/p95
# vary by machine, so a shared runner cannot enforce it fairly — it stays a
# local trend (see benchmarks/README.md).

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # RPC routing tests only check that an archive URL is CONFIGURED (they use
      # fakes, never dial it); a dummy value keeps them hermetic in CI.
      GNOSIS_ARCHIVE_RPC_URL: http://localhost:8545
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install uv via its official script rather than a marketplace action so
      # only first-party actions/* need resolving (the astral-sh/setup-uv action
      # was the only non-actions/* dependency; dropping it shrinks the surface
      # for transient "Failed to resolve action download info" GitHub incidents).
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Regression gate (pytest + deterministic suites)
        run: make bench-check

      - name: Build HTML report
        if: always()
        run: uv run python -m benchmarks.report

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmarks/results/index.html
          if-no-files-found: ignore
