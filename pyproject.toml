[project]
name = "cerebro-mcp"
version = "0.1.0"
description = "MCP server for Gnosis Chain data platform - query ClickHouse with dbt context"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "clickhouse-connect>=0.7.0,<1.0",
    "igraph>=0.11,<1.0",
    "pyarrow>=13.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "truststore>=0.10",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "duckdb>=1.0",
    "aiosqlite>=0.20",
    "web3>=7.0,<8",
    "sqlglot>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cerebro-mcp = "cerebro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro_mcp"]
# report.html is generated by the UI build and gitignored, so hatchling's
# VCS-based file selection skips it; `artifacts` un-ignores just that file.
# A directory-level force-include of static/ would re-add every tracked file
# `packages` already ships, which newer hatchling rejects as a duplicate path.
artifacts = [
    "src/cerebro_mcp/static/report.html",
    "src/cerebro_mcp/static/graph_explorer_web.html",
    "src/cerebro_mcp/static/assets/graph_explorer/**",
]
