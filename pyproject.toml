[project]
name = "cerebro-mcp"
version = "0.1.0"
description = "MCP server for Gnosis Chain data platform - query ClickHouse with dbt context"
requires-python = ">=3.10"
dependencies = [
    # Upper bound is REQUIRED, not cosmetic. The whole server is built on
    # `mcp.server.fastmcp`, which mcp 2.0.0 removed — an unpinned `>=1.2.0`
    # let CI resolve 2.0.0 and every container died at import with
    # `ModuleNotFoundError: No module named 'mcp.server.fastmcp'`
    # (CrashLoopBackOff, 2026-07-28). Moving to 2.x is a port, not an upgrade.
    "mcp[cli]>=1.26,<2",
    "clickhouse-connect>=0.7.0,<1.0",
    "igraph>=0.11,<1.0",
    "pyarrow>=13.0",
    "pydantic-settings>=2.0",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "truststore>=0.10",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.2",
    "duckdb>=1.0",
    "aiosqlite>=0.20",
    "web3>=7.0,<8",
    "sqlglot>=24.0",
    # OAuth resource-server verification (connector plan R10 §5/8). Upper
    # bound is deliberate, same convention as the mcp pin above: this repo
    # has already paid for an unbounded resolve (CrashLoopBackOff
    # 2026-07-28), and token verification is the worst possible place to
    # discover a breaking major. Do NOT hand-roll signature verification —
    # pyjwt[crypto] exists so we author zero lines of crypto.
    "pyjwt[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cerebro-mcp = "cerebro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro_mcp"]
# report.html is generated by the UI build and gitignored, so hatchling's
# VCS-based file selection skips it; `artifacts` un-ignores just that file.
# A directory-level force-include of static/ would re-add every tracked file
# `packages` already ships, which newer hatchling rejects as a duplicate path.
artifacts = [
    "src/cerebro_mcp/static/report.html",
    "src/cerebro_mcp/static/graph_explorer_web.html",
    "src/cerebro_mcp/static/assets/graph_explorer/**",
]
