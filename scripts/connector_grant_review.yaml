# Reviewed approvals for the connector grant closure.
#
# THIS FILE IS THE REVIEW ARTIFACT (connector plan R10 C4). A source or
# passthrough view becomes grantable to the connector identity ONLY by being
# listed here; everything else fails closed into the review worklist that
# scripts/generate_connector_grants.py prints.
#
# approved_sources: physical `db.table` names. Approve a source only when
#   its content is public chain data — a source carrying personal data
#   (mixpanel_ga.*, forum tables, ipinfo, gpay wallet lists) must NEVER be
#   approved; the dependent models stay unreachable on this profile instead.
#
# NOTE on narrowing views: an invoker-executed view cannot read what the
#   caller cannot, so a granted model's closure necessarily grants its
#   parents too — a caller can therefore query a wider parent directly and
#   bypass a narrowing view. Where that is unacceptable, introduce a
#   reviewed `SQL SECURITY DEFINER` connector view or a connector-safe
#   materialization; there is no per-view flag that can express it.
#
# Every addition needs a reviewer and date in the comment beside it.

approved_sources:
  - consensus.specs   # public chain constants; backs gnosis://chain-parameters (plan R10, 2026-07-31)
